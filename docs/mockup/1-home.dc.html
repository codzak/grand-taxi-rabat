<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Accueil, carte des stations</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A4A;text-decoration:none}a:hover{color:#0A4236}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E9EDE6; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #12201C">

<svg width="390" height="470" viewBox="0 0 390 470" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<rect width="390" height="470" fill="#E9EDE6"></rect>
<path d="M210 150 L290 120 L300 230 L225 250 Z" fill="#CFE3C8"></path>
<path d="M-10 300 L400 200" stroke="#FFFFFF" stroke-width="18" fill="none"></path>
<path d="M160 -10 L240 480" stroke="#FFFFFF" stroke-width="14" fill="none"></path>
<path d="M-10 120 L400 90" stroke="#FFFFFF" stroke-width="10" fill="none"></path>
<path d="M40 -10 L90 480" stroke="#FFFFFF" stroke-width="8" fill="none"></path>
<path d="M300 -10 L340 480" stroke="#FFFFFF" stroke-width="8" fill="none"></path>
<path d="M-10 400 L400 380" stroke="#FFFFFF" stroke-width="8" fill="none"></path>
<text x="232" y="196" font-size="11" fill="#3F6B4A" font-family="IBM Plex Sans">Mini Parc</text>
<circle cx="196" cy="268" r="22" fill="#2F6FED" opacity="0.15"></circle>
<circle cx="196" cy="268" r="8" fill="#2F6FED" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>

<sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
<a href="Station.dc.html" aria-label="{{p.label}}" style="{{p.pos}}">
<span style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(18,32,28,0.25); {{p.fill}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5"></path><path d="M3 16h18v3H3z"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>
</span>
</a>
</sc-for>

<div style="position: absolute; left: 16px; right: 16px; top: 20px; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 28px; padding: 0 16px; height: 52px; box-shadow: 0 2px 10px rgba(18,32,28,0.12)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6B66" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="dest" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Destination</label>
<input id="dest" type="search" placeholder="Où allez-vous ? Agdal, Kamra…" style="flex: 1; border: 0; outline: none; font-size: 16px; font-family: inherit; color: #12201C; background: transparent">
</div>
<button type="button" lang="ar" aria-label="تغيير اللغة: العربية" style="width: 52px; height: 52px; border-radius: 26px; border: 0; background: #FFFFFF; box-shadow: 0 2px 10px rgba(18,32,28,0.12); font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 14px; color: #0E5A4A">ع</button>
</div>
</div>

<button type="button" aria-label="Me localiser" style="position: absolute; right: 16px; top: 380px; width: 48px; height: 48px; border-radius: 24px; border: 0; background: #FFFFFF; box-shadow: 0 2px 10px rgba(18,32,28,0.15); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E5A4A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
</button>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 410px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(18,32,28,0.12); display: flex; flex-direction: column">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #D5DBD8; margin: 10px auto 0"></div>
<div style="padding: 14px 20px 8px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 20px">Départs proches</h1>
<sc-if value="{{offline}}" hint-placeholder-val="{{ false }}">
<span role="status" style="align-self: flex-start; display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; background: #EEF0EF; color: #3D4A46; padding: 4px 10px; border-radius: 8px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#3D4A46" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 8.8a15 15 0 0120 0"></path><path d="M5 12.5a10 10 0 0114 0"></path><path d="M8.5 16.4a5 5 0 017 0"></path><path d="M12 20h.01"></path><path d="M3 3l18 18"></path></svg>Hors ligne · données du [date]</span>
</sc-if>
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: none; height: 48px; padding: 0 16px; border-radius: 24px; font-family: inherit; font-size: 14px; font-weight: 500; {{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{list}}" as="s" hint-placeholder-count="3">
<a href="Station.dc.html" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid #E3E8E5; border-radius: 16px; color: #12201C">
<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #E6F0ED; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E5A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5"></path><path d="M3 16h18v3H3z"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-weight: 600; font-size: 16px">{{s.to}}</span>
<span style="font-size: 14px; color: #5B6B66">Départ : {{s.hub}}</span>
<span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px">
<span style="font-size: 13px; font-weight: 600; background: #E6F0ED; color: #0E5A4A; padding: 3px 8px; border-radius: 8px">{{s.price}}</span>
<span style="font-size: 13px; background: #EEF0EF; color: #3D4A46; padding: 3px 8px; border-radius: 8px">{{s.hours}}</span>
<span style="font-size: 13px; background: #EEF0EF; color: #3D4A46; padding: 3px 8px; border-radius: 8px">Non vérifiée</span>
</span>
</span>
<span style="flex: none; font-size: 14px; color: #5B6B66">{{s.walk}}</span>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 8px 0; font-size: 15px; color: #5B6B66">Aucune station connue pour cette destination. <a href="Report.dc.html" style="font-weight: 600">Proposer une station</a></p>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"reseau":{"editor":"enum","options":["ok","hors-ligne"],"default":"ok"},"brand":{"editor":"color","default":"#0E5A4A","options":["#0E5A4A","#1F4E8C","#7A3E12"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dest: 'Toutes' }; }
  renderVals() {
    const brand = this.props.brand ?? '#0E5A4A';
    const stands = [
      { to: 'Agdal, Masjid Badr', key: 'Agdal', hub: 'Mini Parc, Youssoufia', price: '5 Dh / place', hours: 'Jour et nuit', walk: '3 min à pied' },
      { to: 'Centre Ville', key: 'Centre Ville', hub: 'Mini Parc, Youssoufia', price: '5 Dh / place', hours: 'Jour et nuit', walk: '3 min à pied' },
      { to: 'Kamra, Akwass', key: 'Kamra', hub: 'Mini Parc, Youssoufia', price: '5 Dh / place', hours: 'Jour et nuit', walk: '4 min à pied' },
      { to: 'Hay Riad (à confirmer)', key: 'Hay Riad', hub: 'Mini Parc, Youssoufia', price: '7 Dh / place', hours: 'Jour seulement', walk: '4 min à pied' }
    ];
    const labels = ['Toutes', 'Agdal', 'Centre Ville', 'Kamra', 'Hay Riad', 'Témara'];
    const chips = labels.map((l) => {
      const on = this.state.dest === l;
      return { label: l, pressed: on ? 'true' : 'false', pick: () => this.setState({ dest: l }),
        style: on ? 'border: 0; background: ' + brand + '; color: #FFFFFF' : 'border: 1px solid #D5DBD8; background: #FFFFFF; color: #12201C' };
    });
    const list = this.state.dest === 'Toutes' ? stands : stands.filter((s) => s.key === this.state.dest);
    const spots = [[150, 150], [255, 135], [118, 290], [262, 300]];
    const pins = stands.map((s, i) => {
      const dim = this.state.dest !== 'Toutes' && s.key !== this.state.dest;
      return { label: 'Station vers ' + s.to, pos: 'position: absolute; left: ' + (spots[i][0] - 4) + 'px; top: ' + (spots[i][1] - 4) + 'px; padding: 4px',
        fill: 'background: ' + (dim ? '#9AA7A2' : brand) };
    });
    return { chips, list, pins, empty: list.length === 0, offline: this.props.reseau === 'hors-ligne' };
  }
}
</script>
</body>
</html>
