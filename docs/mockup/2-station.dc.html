<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Fiche station Mini Parc</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A4A;text-decoration:none}a:hover{color:#0A4236}
</style>
</helmet>
<div style="width: 390px; height: 844px; display: flex; flex-direction: column; background: #FFFFFF; font-family: 'IBM Plex Sans', system-ui, sans-serif; color: #12201C; overflow: hidden">

<div style="position: relative; height: 200px; background: #DCE4DF; display: flex; align-items: center; justify-content: center">
<span style="font-size: 14px; color: #3D4A46">[Photo de la station]</span>
<a href="Main.dc.html" aria-label="Retour" style="position: absolute; left: 16px; top: 16px; width: 48px; height: 48px; border-radius: 24px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(18,32,28,0.15)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12201C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"></path></svg>
</a>
<button type="button" aria-label="Ajouter aux favoris" style="position: absolute; right: 16px; top: 16px; width: 48px; height: 48px; border-radius: 24px; border: 0; background: #FFFFFF; display: flex; align-items: center; justify-content: center; box-shadow: 0 2px 8px rgba(18,32,28,0.15)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12201C" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l2.7 5.6 6.1.9-4.4 4.3 1 6.1L12 17l-5.4 2.9 1-6.1-4.4-4.3 6.1-.9z"></path></svg>
</button>
</div>

<div style="flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-direction: column; gap: 6px">
<h1 style="margin: 0; font-family: 'Poppins', sans-serif; font-weight: 700; font-size: 24px">Mini Parc, Youssoufia</h1>
<p style="margin: 0; font-size: 15px; color: #5B6B66">Repère : [à compléter sur place]</p>
<span style="align-self: flex-start; font-size: 13px; background: #EEF0EF; color: #3D4A46; padding: 4px 10px; border-radius: 8px">Non vérifiée sur place</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<h2 style="margin: 0; font-family: 'Poppins', sans-serif; font-weight: 600; font-size: 17px">Choisissez votre destination</h2>
<sc-for list="{{dests}}" as="d" hint-placeholder-count="4">
<button type="button" onClick="{{d.pick}}" aria-pressed="{{d.pressed}}" style="display: flex; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 14px; border-radius: 16px; font-family: inherit; color: #12201C; {{d.style}}">
<span style="flex: 1; display: flex; flex-direction: column; gap: 3px">
<span style="font-weight: 600; font-size: 16px">{{d.to}}</span>
<span style="font-size: 14px; color: #5B6B66">{{d.hours}}</span>
</span>
<span style="font-weight: 600; font-size: 15px; background: #E6F0ED; color: #0E5A4A; padding: 4px 10px; border-radius: 8px">{{d.price}}</span>
</button>
</sc-for>
</div>

<sc-if value="{{note}}" hint-placeholder-val="{{ false }}">
<p style="margin: 0; font-size: 14px; color: #3D4A46; background: #F3F6F4; padding: 12px; border-radius: 12px">{{note}}</p>
</sc-if>

<p style="margin: 0; font-size: 13px; color: #5B6B66">Prix par place, information non officielle. Dernière vérification : jamais.</p>
</div>

<div style="padding: 12px 20px 20px; border-top: 1px solid #E3E8E5; display: flex; flex-direction: column; gap: 10px">
<div style="display: flex; gap: 10px">
<a href="https://www.google.com/maps/dir/?api=1&amp;destination=33.9930560,-6.8177405&amp;travelmode=walking" style="flex: 1; height: 52px; border-radius: 26px; background: {{brand}}; color: #FFFFFF; display: flex; align-items: center; justify-content: center; gap: 8px; font-weight: 600; font-size: 16px">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13" cy="4" r="2"></circle><path d="M10 21l2-6-3-3 1-5 4 3 3 1"></path></svg>
Y aller à pied
</a>
<a href="Ride.dc.html" style="flex: 1; height: 52px; border-radius: 26px; border: 2px solid {{brand}}; color: {{brand}}; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 16px; box-sizing: border-box">Voir le trajet</a>
</div>
<a href="Report.dc.html" style="align-self: center; min-height: 48px; display: flex; align-items: center; font-size: 15px; font-weight: 500; padding: 0 16px">Signaler une erreur</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"brand":{"editor":"color","default":"#0E5A4A","options":["#0E5A4A","#1F4E8C","#7A3E12"]},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { pick: 2 }; }
  renderVals() {
    const brand = this.props.brand ?? '#0E5A4A';
    const rows = [
      { to: 'Kamra, Akwass', hours: 'Jour et nuit', price: '5 Dh', note: 'Groupe de 5 ou 6 : le taxi peut aller jusqu\'aux "bâtiments".' },
      { to: 'Centre Ville', hours: 'Jour et nuit', price: '5 Dh', note: '' },
      { to: 'Agdal, Masjid Badr', hours: 'Jour et nuit', price: '5 Dh', note: '' },
      { to: 'Hay Riad', hours: 'Jour seulement', price: '7 Dh', note: 'Destination à confirmer : peut-être Témara.' }
    ];
    const dests = rows.map((r, i) => {
      const on = this.state.pick === i;
      return { ...r, pressed: on ? 'true' : 'false', pick: () => this.setState({ pick: i }),
        style: on ? 'border: 2px solid ' + brand + '; background: #F3F8F6' : 'border: 1px solid #E3E8E5; background: #FFFFFF' };
    });
    return { brand, dests, note: rows[this.state.pick].note };
  }
}
</script>
</body>
</html>
