<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<title>الصفحة الرئيسية، خريطة المحطات</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E5A4A;text-decoration:none}a:hover{color:#0A4236}
</style>
</helmet>
<div dir="rtl" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: #E9EDE6; font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif; color: #12201C">

<svg width="390" height="470" viewBox="0 0 390 470" aria-hidden="true" style="position: absolute; left: 0; top: 0">
<rect width="390" height="470" fill="#E9EDE6"></rect>
<path d="M210 150 L290 120 L300 230 L225 250 Z" fill="#CFE3C8"></path>
<path d="M-10 300 L400 200" stroke="#FFFFFF" stroke-width="18" fill="none"></path>
<path d="M160 -10 L240 480" stroke="#FFFFFF" stroke-width="14" fill="none"></path>
<path d="M-10 120 L400 90" stroke="#FFFFFF" stroke-width="10" fill="none"></path>
<path d="M40 -10 L90 480" stroke="#FFFFFF" stroke-width="8" fill="none"></path>
<path d="M300 -10 L340 480" stroke="#FFFFFF" stroke-width="8" fill="none"></path>
<path d="M-10 400 L400 380" stroke="#FFFFFF" stroke-width="8" fill="none"></path>
<text x="232" y="196" font-size="12" fill="#3F6B4A" font-family="IBM Plex Sans Arabic">ميني بارك</text>
<circle cx="196" cy="268" r="22" fill="#2F6FED" opacity="0.15"></circle>
<circle cx="196" cy="268" r="8" fill="#2F6FED" stroke="#FFFFFF" stroke-width="3"></circle>
</svg>

<sc-for list="{{pins}}" as="p" hint-placeholder-count="4">
<a href="Station.dc.html" aria-label="{{p.label}}" style="{{p.pos}}">
<span style="width: 40px; height: 40px; border-radius: 20px; display: flex; align-items: center; justify-content: center; border: 3px solid #FFFFFF; box-shadow: 0 2px 6px rgba(18,32,28,0.25); {{p.fill}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5"></path><path d="M3 16h18v3H3z"></path><circle cx="7.5" cy="19" r="1.5"></circle><circle cx="16.5" cy="19" r="1.5"></circle></svg>
</span>
</a>
</sc-for>

<div style="position: absolute; left: 16px; right: 16px; top: 20px; display: flex; align-items: center; gap: 10px">
<div style="flex: 1; display: flex; align-items: center; gap: 8px; background: #FFFFFF; border-radius: 28px; padding: 0 16px; height: 52px; box-shadow: 0 2px 10px rgba(18,32,28,0.12)">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5B6B66" stroke-width="2" stroke-linecap="round" aria-hidden="true" style="transform: scaleX(-1)"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<label for="destAr" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">الوجهة</label>
<input id="destAr" type="search" placeholder="إلى أين تذهب؟ أكدال، القامرة…" style="flex: 1; border: 0; outline: none; font-size: 16px; font-family: inherit; color: #12201C; background: transparent">
</div>
<a href="Main.dc.html" lang="fr" aria-label="Changer de langue : français" style="width: 52px; height: 52px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 2px 10px rgba(18,32,28,0.12); display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 14px; color: #0E5A4A">FR</a>
</div>

<button type="button" aria-label="تحديد موقعي" style="position: absolute; left: 16px; top: 380px; width: 48px; height: 48px; border-radius: 24px; border: 0; background: #FFFFFF; box-shadow: 0 2px 10px rgba(18,32,28,0.15); display: flex; align-items: center; justify-content: center">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0E5A4A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3"></path></svg>
</button>

<div style="position: absolute; left: 0; right: 0; bottom: 0; height: 410px; background: #FFFFFF; border-radius: 24px 24px 0 0; box-shadow: 0 -4px 20px rgba(18,32,28,0.12); display: flex; flex-direction: column">
<div style="width: 40px; height: 4px; border-radius: 2px; background: #D5DBD8; margin: 10px auto 0"></div>
<div style="padding: 14px 20px 8px; display: flex; flex-direction: column; gap: 12px">
<h1 style="margin: 0; font-weight: 700; font-size: 21px">الانطلاقات القريبة</h1>
<div style="display: flex; gap: 8px; overflow-x: auto">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5">
<button type="button" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" style="flex: none; height: 48px; padding: 0 16px; border-radius: 24px; font-family: inherit; font-size: 15px; font-weight: 500; {{c.style}}">{{c.label}}</button>
</sc-for>
</div>
</div>
<div style="flex: 1; overflow-y: auto; padding: 4px 20px 20px; display: flex; flex-direction: column; gap: 10px">
<sc-for list="{{list}}" as="s" hint-placeholder-count="3">
<a href="Station.dc.html" style="display: flex; gap: 12px; align-items: flex-start; padding: 14px; border: 1px solid #E3E8E5; border-radius: 16px; color: #12201C">
<span style="flex: none; width: 40px; height: 40px; border-radius: 12px; background: #E6F0ED; display: flex; align-items: center; justify-content: center">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0E5A4A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 16V11l2-5h10l2 5v5"></path><path d="M3 16h18v3H3z"></path></svg>
</span>
<span style="flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-weight: 600; font-size: 17px">{{s.to}}</span>
<span style="font-size: 14px; color: #5B6B66">الانطلاق: {{s.hub}}</span>
<span style="display: flex; gap: 6px; flex-wrap: wrap; margin-top: 4px">
<span style="font-size: 13px; font-weight: 600; background: #E6F0ED; color: #0E5A4A; padding: 3px 8px; border-radius: 8px">{{s.price}}</span>
<span style="font-size: 13px; background: #EEF0EF; color: #3D4A46; padding: 3px 8px; border-radius: 8px">{{s.hours}}</span>
<span style="font-size: 13px; background: #EEF0EF; color: #3D4A46; padding: 3px 8px; border-radius: 8px">غير مُتحقَّق منها</span>
</span>
</span>
<span style="flex: none; font-size: 14px; color: #5B6B66">{{s.walk}}</span>
</a>
</sc-for>
<sc-if value="{{empty}}" hint-placeholder-val="{{ false }}">
<p style="margin: 8px 0; font-size: 15px; color: #5B6B66">لا نعرف محطة لهذه الوجهة بعد. <a href="Report.dc.html" style="font-weight: 600">اقترح محطة</a></p>
</sc-if>
</div>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { dest: 'all' }; }
  renderVals() {
    const brand = '#0E5A4A';
    // Same stands and filter as 1-home, in Arabic
    const stands = [
      { to: 'أكدال، مسجد بدر', key: 'agdal', hub: 'ميني بارك، اليوسفية', price: '5 دراهم للمقعد', hours: 'ليلاً ونهاراً', walk: '3 دقائق مشياً' },
      { to: 'وسط المدينة', key: 'centre', hub: 'ميني بارك، اليوسفية', price: '5 دراهم للمقعد', hours: 'ليلاً ونهاراً', walk: '3 دقائق مشياً' },
      { to: 'القامرة، أكواس', key: 'kamra', hub: 'ميني بارك، اليوسفية', price: '5 دراهم للمقعد', hours: 'ليلاً ونهاراً', walk: '4 دقائق مشياً' },
      { to: 'حي الرياض (للتأكيد)', key: 'hayriad', hub: 'ميني بارك، اليوسفية', price: '7 دراهم للمقعد', hours: 'نهاراً فقط', walk: '4 دقائق مشياً' }
    ];
    const labels = [['all', 'الكل'], ['agdal', 'أكدال'], ['centre', 'وسط المدينة'], ['kamra', 'القامرة'], ['hayriad', 'حي الرياض'], ['temara', 'تمارة']];
    const chips = labels.map(([k, l]) => {
      const on = this.state.dest === k;
      return { label: l, pressed: on ? 'true' : 'false', pick: () => this.setState({ dest: k }),
        style: on ? 'border: 0; background: ' + brand + '; color: #FFFFFF' : 'border: 1px solid #D5DBD8; background: #FFFFFF; color: #12201C' };
    });
    const list = this.state.dest === 'all' ? stands : stands.filter((s) => s.key === this.state.dest);
    const spots = [[150, 150], [255, 135], [118, 290], [262, 300]];
    const pins = stands.map((s, i) => {
      const dim = this.state.dest !== 'all' && s.key !== this.state.dest;
      return { label: 'محطة نحو ' + s.to, pos: 'position: absolute; left: ' + (spots[i][0] - 4) + 'px; top: ' + (spots[i][1] - 4) + 'px; padding: 4px',
        fill: 'background: ' + (dim ? '#9AA7A2' : brand) };
    });
    return { chips, list, pins, empty: list.length === 0 };
  }
}
</script>
</body>
</html>
